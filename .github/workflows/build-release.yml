name: Build release APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-37.0 build-tools;37.0.0"
      - name: Link android-37 platform dir if needed
        run: |
          ls "$ANDROID_HOME/platforms/" || echo "no platforms dir"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
            echo "linked android-37 -> android-37.0"
          fi
          ls "$ANDROID_HOME/platforms/"
      - name: Restore release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > release.keystore
            printf 'storeFile=release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$RELEASE_KEYSTORE_PASSWORD" "$RELEASE_KEY_ALIAS" "$RELEASE_KEY_PASSWORD" > key.properties
            echo "Release keystore restored"
          else
            echo "No RELEASE_KEYSTORE_BASE64 secret set; release signing is not configured"
            exit 1
          fi
      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace
          echo "gradle exit code: $?"
          ls -la app/build/ || echo "NO app/build dir after gradle!"
      - name: List APK outputs
        if: always()
        run: |
          echo "PWD=$(pwd)"
          ls -R app/build/outputs || echo "no app/build/outputs dir"
          echo "--- find all apk ---"
          find . -name "*.apk" -print || true
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: app-release
          path: app/build/outputs/apk/
          if-no-files-found: error
