# One-time workflow: merge upstream main into fork main.
# It only joins the commit histories. The fork's main already contains the
# upstream v2.0.108 changes plus the custom switches, so the merge must not
# change any file content. If it would, the job fails WITHOUT pushing.
# This file is deleted after the merge succeeds.
name: Sync upstream once
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  merge-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fork main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge upstream main, keeping fork content on conflicts
        run: |
          set -e
          git config user.name "devilrock111"
          git config user.email "devilrock111@users.noreply.github.com"
          git remote add upstream https://github.com/bennybar/LuliReddit.git
          git fetch upstream main
          git checkout main
          # Merge; conflicts are expected. Resolve ALL of them by keeping
          # the fork's current content.
          git merge upstream/main --no-edit || true
          CONFLICTS=$(git diff --name-only --diff-filter=U || true)
          if [ -n "$CONFLICTS" ]; then
            echo "Conflicts in: $CONFLICTS"
            echo "$CONFLICTS" | xargs -r git checkout --ours --
            git add -A
          fi
          # Safety check: the merge must not change any file content
          # compared with main before the merge. If it would, abort.
          if ! git diff --cached --quiet; then
            echo "ERROR: merge would change file contents; aborting without pushing."
            git diff --cached --stat
            exit 1
          fi
          git commit -m "Merge upstream main (v2.0.108) into fork main" || echo "Merge already committed (no conflicts, no content changes)"
          # Safety check: upstream tip must now be an ancestor of main.
          git merge-base --is-ancestor upstream/main HEAD || { echo "ERROR: upstream not merged"; exit 1; }
          git push origin main
